name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # Secret STORAGE_CREDENTIALS la JSON dang:
        #   {"aws_access_key_id": "...", "aws_secret_access_key": "..."}
        # Tach ra thanh bien moi truong chuan cua AWS de ca dvc[s3] lan boto3 dung duoc.
        # add-mask de gia tri khong bi lo trong log neu co buoc nao in ra.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python - <<'PYEOF'
          import json, os

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          region = os.environ.get("AWS_REGION") or "us-east-1"

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for key in ("aws_access_key_id", "aws_secret_access_key"):
                  value = creds[key]
                  print(f"::add-mask::{value}")
                  env_file.write(f"{key.upper()}={value}\n")
              env_file.write(f"AWS_DEFAULT_REGION={region}\n")

          print(f"Da cau hinh AWS credentials, region = {region}")
          PYEOF

      - name: Pull data with DVC
        # Chi pull hai file can cho viec huan luyen, khong can train_batch2.csv.
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # Doc f1_score tu report.json va dua ra output de job quality-gate doc duoc.
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT
          echo "f1_score cua lan chay nay: $F1"

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          key = "artifacts/current/model.joblib"

          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket, key)

          print(f"Da upload model len s3://{bucket}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          THRESHOLD = 0.65
          # Output cua GitHub Actions luon la chuoi, phai ep ve float truoc khi so sanh.
          f1 = float(os.environ["F1"])

          if f1 < THRESHOLD:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < {THRESHOLD}. Huy trien khai."
              )

          print(f"PASSED: f1_score {f1:.4f} >= {THRESHOLD}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # Restart service de serve.py tai lai model moi nhat tu cloud storage
            sudo systemctl restart income-api

            # Thu health check nhieu lan, cho server kip khoi dong va tai model
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed sau $i lan thu."
                exit 0
              fi
              echo "Lan thu $i: server chua san sang, doi 5 giay..."
              sleep 5
            done

            echo "Health check that bai sau 10 lan thu. Xem log:"
            sudo journalctl -u income-api -n 50 --no-pager
            exit 1
